[project]
name = "gpuwarden"
version = "0.1.0"
description = "Scheduled up/down, one-shot pods and verified teardown for rented RunPod GPUs"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []          # stdlib only — the heavy lifting is runpodctl + curl on the host

[project.scripts]
gwctl = "gpuwarden.cli:main"

[tool.ruff]
lint.select = ["E4", "E7", "E9", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpuwarden"]

# ship the bash halves as package data — cli.py resolves them as siblings of itself
[tool.hatch.build.targets.wheel.force-include]
"src/gpuwarden/cloud.sh" = "gpuwarden/cloud.sh"
